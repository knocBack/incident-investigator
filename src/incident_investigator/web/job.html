{% extends "base.html" %}
{% block content %}
    <span class="eyebrow">CLI job {{ job.id }}</span>
    <h1 id="job-status">{{ job.status }}</h1>
    <div class="command">{{ job.command }}</div>
    <div class="terminal" id="job-output" data-job="{{ job.id }}">{{ job.output }}</div>
    <p id="job-exit"></p>
    <div id="job-runs"></div>
    <p class="page-note">Output streams from the real subprocess. Browser disconnects do not cancel it. Failed attempts remain available.</p>
{% endblock %}
