[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-investigator"
version = "0.0.0"
description = "Local multi-agent incident investigation MVP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite==0.22.1",
  "fastapi",
  "httpx",
  "langchain-core==1.6.12",
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite==3.1.2",
  "pydantic==2.12.5",
  "uvicorn",
]

[dependency-groups]
dev = [
  "pre-commit",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/incident_investigator"]
