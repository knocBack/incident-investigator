[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-investigator"
version = "0.0.0"
description = "Local multi-agent incident investigation MVP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite==0.22.1",
  "fastapi",
  "httpx",
  "jinja2>=3.1.6",
  "langchain-core==1.6.12",
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite==3.1.2",
  "markdown-it-py>=4.2.0",
  "pydantic==2.12.5",
  "uvicorn",
]

[project.scripts]
incident-investigator = "incident_investigator.cli:main"

[project.optional-dependencies]
phoenix = [
    "arize-phoenix-otel>=0.17.2",
    "openinference-instrumentation-langchain>=0.1.79",
]

[dependency-groups]
dev = [
  "pre-commit",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in test that calls a model provider"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/incident_investigator"]

[tool.hatch.build.targets.wheel.force-include]
"evals/expected" = "incident_investigator/grading/expected"
"tests/scripted-demo.json" = "incident_investigator/scripted-demo.json"
"tests/scripted-paired.json" = "incident_investigator/scripted-paired.json"
